// Configure after Android's task setup and preserve every previous test result.
def motorTestRun = 'motor-' + java.util.UUID.randomUUID().toString()
gradle.taskGraph.whenReady { graph ->
    graph.allTasks.findAll { it instanceof org.gradle.api.tasks.testing.Test }.each { task ->
        def output = task.project.layout.buildDirectory.dir('test-results/' + motorTestRun + '/' + task.name)
        task.binaryResultsDirectory.set(output.map { it.dir('binary') })
        task.reports.junitXml.outputLocation.set(output.map { it.dir('xml') })
        task.reports.html.outputLocation.set(output.map { it.dir('html') })
        task.logger.lifecycle('Preserved test outputs: ' + output.get().asFile)
    }
}
